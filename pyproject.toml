[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stablerun"
version = "0.3.0"
description = "Agent-based stress test of stablecoin runs and Treasury-bill fire-sale spillovers"
authors = [{name = "Thanatchon Chongmankhong"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.8", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
